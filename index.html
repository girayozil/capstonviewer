<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Capston N11.01 in 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Base rules the Claude page shell used to provide */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: one-screen layout editor. Slim title strip, full-bleed 3D stage, inspector for the selected object, tabbed dock. */
:root {
  --bg: #dad1bd;        /* brochure plan paper */
  --panel: #efe8d8;
  --fg: #4a3c33;
  --muted: #7c6a5c;
  --line: #b9ab93;
  --accent: #6a584c;    /* plan wall brown */
  --accent-fg: #f6f0e2;
  --sel: #1f6fd9;       /* movable selection */
  --fix: #b5352b;       /* built-in selection */
  --display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2a231f; --panel: #362d27; --fg: #eee4d2; --muted: #b7a892; --line: #5a4c41;
    --accent: #d9c7a3; --accent-fg: #2a231f; --sel: #6aa5f5; --fix: #ef7d72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2a231f; --panel: #362d27; --fg: #eee4d2; --muted: #b7a892; --line: #5a4c41;
  --accent: #d9c7a3; --accent-fg: #2a231f; --sel: #6aa5f5; --fix: #ef7d72; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); display: flex; flex-direction: column; overflow: hidden; }
header { padding-block: 10px 6px; padding-inline: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.3rem; margin: 0; letter-spacing: 0.04em; margin-right: auto; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.cap { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
button {
  font: 500 0.8rem var(--body); color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
button[aria-pressed="true"], button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
.small button { padding: 4px 10px; font-size: 0.74rem; }

#main { flex: 1 1 auto; min-height: 120px; display: flex; }
#stage { flex: 1 1 auto; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
#side { flex: 0 0 290px; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; min-height: 0; }
#side #p-bank { flex: 1 1 auto; flex-direction: column; flex-wrap: nowrap; align-items: stretch; min-height: 0; gap: 8px; }
#side #bank { flex: 1 1 auto; flex-direction: column; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; min-height: 0; padding-right: 4px; }
#side .card { touch-action: pan-y; }
.cathead { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; flex: 0 0 auto; align-self: center; }
#side .cathead { align-self: flex-start; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#hint { position: absolute; left: 16px; bottom: 52px; width: fit-content; max-width: calc(100% - 110px); font-size: 0.72rem; color: var(--muted);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; pointer-events: none; transition: opacity 0.5s; }
#hint.fading { opacity: 0; }
/* on the 3D view: views along the bottom, Undo above them on the right, the Display menu under the Walk button */
#views { position: absolute; left: 16px; right: 16px; bottom: 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; padding: 2px; z-index: 2; }
#views::-webkit-scrollbar { display: none; }
#views button { flex: 0 0 auto; background: var(--panel); }
#views button[aria-pressed="true"] { background: var(--accent); }
#undo { position: absolute; right: 16px; bottom: 52px; background: var(--panel); z-index: 2; }
#dispbtn { position: absolute; top: 60px; right: 16px; background: var(--panel); z-index: 2; }
#dispbtn[aria-expanded="true"] { border-color: var(--accent); }
#dispmenu { position: absolute; top: 98px; right: 16px; max-width: calc(100% - 32px); z-index: 3; display: flex; flex-direction: column; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(40, 28, 20, 0.18); }
#langbtn { padding: 4px 10px; font-size: 0.74rem; }
#langbtn span { color: var(--muted); }
#langbtn span.on { color: var(--fg); font-weight: 700; }
#walkbtn { position: absolute; top: 8px; right: 16px; z-index: 2; display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.95rem; font-weight: 600; padding: 9px 18px 9px 14px; background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
  box-shadow: 0 2px 10px rgba(40, 28, 20, 0.28); }
#walkbtn svg { width: 20px; height: 20px; flex: 0 0 auto; }
#walkbtn.fresh { animation: walkpulse 2.2s ease-out infinite; }
@keyframes walkpulse { 0% { box-shadow: 0 2px 10px rgba(40, 28, 20, 0.28), 0 0 0 0 var(--accent); } 70%, 100% { box-shadow: 0 2px 10px rgba(40, 28, 20, 0.28), 0 0 0 12px transparent; } }
@media (prefers-reduced-motion: reduce) { #walkbtn.fresh { animation: none; } }
#walkbtn[aria-pressed="true"] { font-size: 0.8rem; font-weight: 500; padding: 6px 12px; background: var(--panel); color: var(--fg); border-color: var(--line); box-shadow: none; }
#walkbtn[aria-pressed="true"] svg { display: none; }
#nemo-btn::before { content: ""; display: inline-block; width: 26px; height: 14px; margin-right: 7px; vertical-align: -2px; border-radius: 7px;
  background: radial-gradient(circle at 7px 7px, var(--panel) 4.5px, transparent 5px), var(--muted); }
#nemo-btn[aria-checked="true"]::before { background: radial-gradient(circle at 19px 7px, var(--panel) 4.5px, transparent 5px), var(--accent); }
#walkhud { position: absolute; left: 16px; top: 8px; max-width: calc(100% - 150px); width: fit-content; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center;
  font-size: 0.75rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; z-index: 2; }
/* walk mode: the dock is a drawer behind the Menu button; furniture editing and the wall height choice are not offered */
body.walking:not(.drawer) .dock, body.walking:not(.drawer) #side, body.walking #undo, body.walking #views, body.walking #tab-bank, body.walking #walls-row { display: none; }
#drawerbtn { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel); z-index: 2; }
#stick { position: absolute; left: 20px; bottom: 20px; width: 112px; height: 112px; border-radius: 50%; background: var(--panel); opacity: 0.85; border: 1px solid var(--line); touch-action: none; z-index: 2; }
#knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--accent); pointer-events: none; }
#fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }
.tag { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;
  font: 600 0.72rem var(--body); font-variant-numeric: tabular-nums; padding: 2px 7px; border-radius: 6px;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
#dimtag { border-color: var(--sel); color: var(--sel); font-size: 0.8rem; }
#dimtag.fixed { border-color: var(--fix); color: var(--fix); }

#inspector { background: var(--panel); border-top: 1px solid var(--line); padding-block: 8px; padding-inline: 16px; display: flex; flex-direction: column; gap: 8px; }
#insp-head { display: flex; align-items: center; gap: 8px; }
#insp-name { font-weight: 600; font-size: 0.95rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#insp-badge { font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--fix); color: var(--fix); }
#insp-close { margin-left: auto; }
.insp-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 999px; }
.seg button { border-color: transparent; }
.fields { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.fields label { display: flex; flex-direction: column; gap: 2px; font-size: 0.64rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.fields input { box-sizing: border-box; width: 100%; min-width: 0; font: 600 0.9rem var(--body); font-variant-numeric: tabular-nums; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; }
#insp-fixed { font-size: 0.85rem; color: var(--muted); margin: 0; }

.dock { background: var(--panel); border-top: 1px solid var(--line); padding-block: 8px; padding-inline: 16px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.tabs { display: flex; gap: 6px; }
#bankfilter button { flex: 0 0 auto; }
.dock #bankfilter { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
.dock #bankfilter::-webkit-scrollbar { display: none; }
/* wide screens: the dock moves into the sidebar, with Furniture and Layouts as its tabs */
#side .dock { flex: 1 1 auto; min-height: 0; padding: 0; border-top: none; background: none; }
#side #bankfilter { flex-wrap: wrap; overflow-x: visible; }
/* phones: the item panel takes the dock's place while something is selected */
@media (max-width: 899px) { body.editing .dock { display: none; } #p-bank > .cap { display: none; } }
.linkbtn { align-self: flex-start; border: none; background: none; padding: 0; font-size: 0.74rem; color: var(--muted); text-decoration: underline; }
.panel { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
#bank { display: flex; gap: 8px; overflow-x: auto; touch-action: pan-x; padding-bottom: 4px; width: 100%; }
.card { flex: 0 0 auto; text-align: left; border-radius: 10px; padding: 6px 10px; display: flex; flex-direction: column; gap: 1px; touch-action: pan-x; user-select: none; -webkit-user-select: none; }
.card b { font-weight: 600; font-size: 0.8rem; }
.card span { font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
#p-layouts { flex-direction: column; align-items: stretch; gap: 6px; }
#saved { display: flex; flex-direction: column; gap: 4px; max-height: 7.5rem; overflow-y: auto; }
.srow { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
.srow span { margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow small { color: var(--muted); }
#lname { flex: 1 1 8rem; min-width: 0; font: 500 0.85rem var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
#status { font-size: 0.75rem; color: var(--muted); min-height: 1em; margin: 0; }
#copybox { width: 100%; height: 4.5rem; font: 0.7rem ui-monospace, monospace; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
</style>
</head>
<body>

<header>
  <h1>Capston N11.01</h1>
  <button id="langbtn" aria-label="Language / Dil"><span data-lang="en">EN</span> / <span data-lang="tr" lang="tr">TR</span></button>
</header>

<div id="main">
<div id="stage">
  <canvas id="view" aria-label="3D model of apartment N11.01"></canvas>
  <button id="walkbtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 2.5 2.5V21"/><path d="M12 15l-.5-5.5L15 11l2.5 2"/><path d="M11.5 9.5L8 12v3"/></svg><span id="walklab">Walk through</span></button>
  <div id="walkhud" hidden><span id="walkhint"></span><span class="row small"><button id="nemo-btn" role="switch" aria-checked="true" data-i18n="nhome">Nemo is at home</button><button id="nemo-call" data-i18n="ncall" title="Space" aria-keyshortcuts="Space">Call Nemo</button><button id="nemo-bed" data-i18n="nbed" title="B" aria-keyshortcuts="B">Send Nemo to bed</button></span></div>
  <button id="dispbtn" aria-expanded="false" aria-controls="dispmenu"><span data-i18n="display">Display</span> ▾</button>
  <div id="dispmenu" hidden>
    <div class="row small" role="group" aria-label="Walls" id="walls-row">
      <span class="cap" data-i18n="walls">Walls</span>
      <button id="w-cut" data-walls="cut" aria-pressed="true" data-i18n="cut">Cut away</button>
      <button id="w-full" data-walls="full" aria-pressed="false" data-i18n="full">Full height</button>
    </div>
    <div class="row small"><button id="screens" aria-pressed="false" data-i18n="screens">Partitions</button></div>
  </div>
  <div id="views" role="group" aria-label="View" class="small">
    <button id="v-over" data-view="over" aria-pressed="true" data-i18n="over">Overview</button>
    <button id="v-top" data-view="top" aria-pressed="false" data-i18n="plan" title="Alt+J" aria-keyshortcuts="Alt+J">Plan</button>
    <button id="v-living" data-view="living" aria-pressed="false" data-i18n="living">Living</button>
    <button id="v-nook" data-view="nook" aria-pressed="false" data-i18n="nook">Play corner</button>
    <button id="v-bed" data-view="bed" aria-pressed="false" data-i18n="office">Guest bedroom</button>
  </div>
  <button id="undo" class="small" data-i18n="undo" title="Ctrl+Z" aria-keyshortcuts="Control+Z" hidden>Undo</button>
  <button id="drawerbtn" aria-expanded="false" aria-controls="dock" hidden></button>
  <div id="stick" hidden><div id="knob"></div></div>
  <div id="dimtag" class="tag" hidden></div>
  <div id="gap0" class="tag" hidden></div><div id="gap1" class="tag" hidden></div><div id="gap2" class="tag" hidden></div><div id="gap3" class="tag" hidden></div>
  <div id="hint" data-i18n="hint">Tap an object to select it · drag empty space to turn the view · pinch or scroll to zoom</div>
  <div id="fail" data-i18n="fail" hidden>This device could not start the 3D view.</div>
</div>
<aside id="side" aria-label="Furniture" hidden></aside>
</div>

<div id="inspector" hidden>
  <div id="insp-head">
    <span id="insp-name"></span><span id="insp-badge" hidden></span>
    <button id="insp-close" class="small" data-i18n="done">Done</button>
  </div>
  <div id="insp-edit">
    <div class="insp-rows">
      <div class="row">
        <div class="seg" role="group" aria-label="Tool">
          <button id="t-move" data-tool="move" aria-pressed="true" data-i18n="move" title="W" aria-keyshortcuts="W">Move</button>
          <button id="t-rotate" data-tool="rotate" aria-pressed="false" data-i18n="rotate" title="E" aria-keyshortcuts="E">Rotate</button>
          <button id="t-scale" data-tool="scale" aria-pressed="false" data-i18n="scale" title="R" aria-keyshortcuts="R">Resize</button>
        </div>
        <button id="magnet" aria-pressed="true" data-i18n="magnet" title="Alt">Magnet</button>
      </div>
      <div class="row small">
        <button id="a-dup" data-i18n="dup">Duplicate</button>
        <button id="a-lock" data-i18n="lock">Lock</button>
        <button id="a-del" data-i18n="del">Delete</button>
        <button id="a-fill" hidden>Fill with books</button>
        <button id="a-more" aria-expanded="false" aria-controls="insp-more"></button>
      </div>
      <div class="row small" id="insp-more" hidden>
        <button id="a-top" aria-pressed="false" data-i18n="sits">Sits on furniture</button>
        <button id="a-lvup" data-i18n="lvup" hidden>Shelf up</button>
        <button id="a-lvdown" data-i18n="lvdown" hidden>Shelf down</button>
      </div>
    </div>
    <div class="fields">
      <label><span data-i18n="fw">Width cm</span><input id="f-w" type="number" inputmode="decimal" min="1" max="1500" step="1"></label>
      <label><span data-i18n="fd">Depth cm</span><input id="f-d" type="number" inputmode="decimal" min="1" max="1500" step="1"></label>
      <label><span data-i18n="fh">Height cm</span><input id="f-h" type="number" inputmode="decimal" min="1" max="400" step="1"></label>
      <label><span data-i18n="fy">Off floor</span><input id="f-y" type="number" inputmode="decimal" min="0" max="300" step="1"></label>
      <label><span data-i18n="fr">Angle °</span><input id="f-r" type="number" inputmode="decimal" step="1"></label>
    </div>
  </div>
  <p id="insp-fixed" hidden></p>
</div>

<div class="dock" id="dock">
  <div class="tabs" role="group" aria-label="Panels">
    <button id="tab-bank" data-tab="bank" aria-pressed="false" aria-controls="p-bank" data-i18n="tbank">Furniture</button>
    <button id="tab-layouts" data-tab="layouts" aria-pressed="false" aria-controls="p-layouts" data-i18n="tlay">Layouts</button>
  </div>
  <div class="panel" id="p-bank" hidden>
    <span class="cap" data-i18n="bankhint">Tap to add, or drag into the flat</span>
    <div id="bankfilter" class="row small" role="group" aria-label="Type"></div>
    <div id="bank"></div>
  </div>
  <div class="panel" id="p-layouts" hidden>
    <div id="saved"></div>
    <div class="row">
      <input id="lname" type="text" maxlength="40" data-i18n-ph="lname" placeholder="Layout name">
      <button id="l-save" data-i18n="save">Save</button>
    </div>
    <div class="row small">
      <button id="l-reset" data-i18n="reset">Back to starting layout</button>
    </div>
    <button id="l-copy" class="linkbtn" data-i18n="copy">Copy layout as text</button>
    <textarea id="copybox" readonly hidden></textarea>
    <p id="status"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

      step: function (ts) { var dt = Math.max(0, Math.min(0.05, (ts - S.last) / 1000 || 0)); S.last = ts; if (!on || !walk.on || !g.visible) return; if (!G.ready) gridBuild(450); think(dt); animate(dt, ts / 1000); dirty = true; }
    };
  })();
  function tick(ts) {
    walkStep(ts || 0); nemo.step(ts || 0);
    if (goal && !walk.on) {
      var a = 0.14; cam.t.lerp(goal.t, a); cam.r += (goal.r - cam.r) * a; cam.pol += (goal.pol - cam.pol) * a;
      var da = goal.az - cam.az; da = Math.atan2(Math.sin(da), Math.cos(da)); cam.az += da * a;
      if (Math.abs(goal.r - cam.r) < 0.01 && Math.abs(da) < 0.002 && cam.t.distanceTo(goal.t) < 0.01) goal = null; dirty = true;
    }
    if (dirty) { if (walk.on) placeWalk(); else place(); camera.updateMatrixWorld(); tags(); renderer.render(scene, camera); dirty = false; }
    requestAnimationFrame(tick);
  }

  // ================= start
  (function () {
    var l = null, h = (location.hash || '').replace('#', '').toLowerCase();
    if (h === 'tr' || h === 'en') l = h;
    if (!l) { try { l = localStorage.getItem('capston-lang'); } catch (e) {} }
    if (!l) l = /^tr/i.test(navigator.language || '') ? 'tr' : 'en';
    loadLocal();
    var work = null; try { work = JSON.parse(localStorage.getItem('capston-n1101-work') || 'null'); } catch (e) {}
    var ok = work && (work.v >= 1 && work.v <= 4) && Array.isArray(work.items);
    if (ok && work.v === 1) work.items.forEach(function (it) { if (it && it.k === 'rug') { var wide = (+it.w || 0) >= (+it.d || 0); it.w = wide ? 2.85 : 1.95; it.d = wide ? 1.95 : 2.85; } });   // one-off: the rug became 285 x 195
    if (ok && work.v < 3) work.items.forEach(function (it) { if (it && it.k === 'rugRound') it.w = it.d = 2.45; });   // one-off: the round rug became 245 across
    setItems(ok ? work.items : START);
    if (ok && work.v < 4) { var filled = 0; items.filter(isShelving).forEach(function (sh) { if (!hasBooks(sh)) filled += fillShelving(sh); }); if (filled) commit(); }   // one-off: shelving already in the layout gets a first set of books
    setLang(l, false);
  })();
  placeBank(); bg(); resize(); setWalls('cut'); setView('over', true); tick();
})();
</script>
